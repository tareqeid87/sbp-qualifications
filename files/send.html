<!doctype html><meta charset="utf-8"><title>send</title><body>sending…<script>
const f=new URLSearchParams(location.search).get('f');
fetch('carousel-'+f+'.pdf').then(r=>r.arrayBuffer()).then(b=>{
 if(window.opener){window.opener.postMessage({sbpPdf:f,buf:b},'https://www.linkedin.com',[b]);document.body.textContent='sent '+b.byteLength;}
 else document.body.textContent='no opener';
});
</script>
